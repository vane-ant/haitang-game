<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海龟汤身份局</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ========== 登录页 ========== -->
  <div id="login" class="screen">
    <div class="logo">🐢</div>
    <h1>海龟汤 · 身份局</h1>
    <p class="sub">不知道自己是谁，才是最刺激的</p>
    <input id="nick" type="text" maxlength="12" placeholder="输入昵称（最多12字）">
    <div class="row">
      <button id="btnCreate" class="btn primary">创建房间</button>
      <button id="btnJoin" class="btn ghost">加入房间</button>
    </div>
    <input id="joinCode" type="text" maxlength="4" placeholder="房间号（4位）" style="display:none">
    <div id="loginErr" class="err"></div>
  </div>

  <!-- ========== 游戏页 ========== -->
  <div id="game" class="screen" hidden>

    <!-- 演示模式提示 -->
    <div id="demoBanner" class="demo-banner" hidden>
      🧪 演示模式：仅静态预览 UI，完整功能需本地运行 <code>node server.js</code>
    </div>

    <!-- 顶栏 -->
    <header>
      <div class="topbar">
        <span class="room-tag">房间 <b id="roomId">----</b></span>
        <span id="phaseTag" class="phase-tag">等待中</span>
        <button id="btnPanel" class="mini-btn">☰</button>
      </div>

      <!-- 玩家列表 -->
      <div id="players" class="players"></div>

      <!-- 汤面卡片 -->
      <div id="soupCard" class="soup-card" hidden>
        <div class="soup-title">🥣 汤面</div>
        <div id="soupFace" class="soup-face"></div>
      </div>
    </header>

    <!-- 消息流 -->
    <main id="msgs" class="msgs"></main>

    <!-- 底栏：输入 -->
    <footer>
      <div class="mode-switch">
        <button id="modeChat" class="mode-btn active">聊天</button>
        <button id="modeAsk" class="mode-btn">提问（-1次）</button>
        <span id="myQuota" class="quota"></span>
      </div>
      <div class="input-row">
        <input id="msgInput" type="text" maxlength="200" placeholder="说点什么…">
        <button id="btnSend" class="send-btn">发送</button>
      </div>
      <div id="inputHint" class="input-hint"></div>
    </footer>
  </div>

  <!-- ========== 房主面板（抽屉） ========== -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-head">主持人控制台 <button id="btnClosePanel" class="mini-btn">✕</button></div>
    <div class="drawer-body">

      <section id="secSetup" class="sec">
        <h3>📋 开局设置</h3>
        <textarea id="inpFace" placeholder="汤面（离奇场景描述）"></textarea>
        <textarea id="inpBottom" placeholder="汤底（完整真相，仅主持人可见）"></textarea>
        <div class="row">
          <label>总次数 T：<input id="inpT" type="number" min="10" max="999" value="40"></label>
        </div>
        <button id="btnSetup" class="btn primary full">开始游戏</button>
      </section>

      <section id="secAssign" class="sec" hidden>
        <h3>🎭 分配身份（秘密）</h3>
        <div id="assignList"></div>
        <p class="hint">身份池：1 侦探 / 3 无辜者 / 1 杀手。点按钮分配，玩家会在自己屏幕上看到身份。</p>
      </section>

      <section id="secAnswer" class="sec" hidden>
        <h3>🔍 待回答的提问</h3>
        <div id="pendingList"></div>
        <p class="hint" id="pendingEmpty">暂无待答提问</p>
      </section>

      <section class="sec">
        <h3>📜 公开补充汤面</h3>
        <textarea id="inpAnnounce" placeholder="补充一小部分汤面内容（可含杀手暗号）"></textarea>
        <button id="btnAnnounce" class="btn ghost full">发布补充</button>
      </section>

      <section id="secKill" class="sec" hidden>
        <h3>🔪 杀手清空次数（剩 <span id="killLeft">2</span> 次）</h3>
        <select id="killTarget"></select>
        <button id="btnKill" class="btn danger full">清空该玩家全部次数</button>
      </section>

      <section id="secTransfer" class="sec" hidden>
        <h3>🕵️ 转让侦探身份（不公开）</h3>
        <select id="transFrom"></select>
        <span>→</span>
        <select id="transTo"></select>
        <button id="btnTransfer" class="btn warning full">执行转让</button>
      </section>

      <section id="secEnd" class="sec" hidden>
        <h3>🏁 结束 / 判定</h3>
        <input id="inpResult" type="text" placeholder="结果说明（如：无辜者获胜）">
        <button id="btnEnd" class="btn full">结束游戏并公布身份</button>
      </section>

    </div>
  </div>

</div>
<script src="client.js"></script>
</body>
</html>
